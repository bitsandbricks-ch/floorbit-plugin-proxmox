# Proxmox VE hosts, VMs and containers in the inventory, and the hosts (and the VMs you tag) on the
# health wall. Off until turned on under Settings > Plugins. It only reads: give it an API token
# with the PVEAuditor role.
id: proxmox
name: Proxmox VE
icon: server
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "Proxmox VE in Floorbit: every host, VM and container goes into the inventory with its cores, memory, disk and the host it runs on. The health wall shows each host with its CPU and memory, the cluster's quorum, and the VMs and containers you tag."
author: Floorbit
homepage: https://www.proxmox.com/en/products/proxmox-virtual-environment/overview
uses: [settings, http, health, inventory]
settings:
  - {key: url, label: Proxmox URL, type: url, placeholder: "https://pve.example.com:8006",
     help: "Any host of the cluster, with its port (8006)."}
  - {key: token_id, label: API token ID, type: string, placeholder: "floorbit@pve!floorbit",
     help: "Datacenter > Permissions > API Tokens: user@realm!name. Give the token the PVEAuditor role on /."}
  - {key: token_secret, label: API token secret, type: secret}
  - {key: watch_tag, label: Health wall tag, type: string, default: floorbit,
     help: "VMs and containers with this Proxmox tag are on the health wall: red when they don't run. Empty: none."}
  - {key: verify_ssl, label: Verify TLS certificates, type: bool, default: true,
     help: "Proxmox ships with a self-signed certificate. Turn it off only on a network you trust."}
